
name: Build ZERO STORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZERO STORE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android Components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Configure Bubblewrap
        run: |
          SDK_PATH="/usr/local/lib/android/sdk"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID SDK=$SDK_PATH"
          test -d "$SDK_PATH/build-tools"
          test -d "$SDK_PATH/platforms"
          test -d "$SDK_PATH/cmdline-tools"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_PATH" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > zero-store-release.keystore
          test -s zero-store-release.keystore

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Check Bubblewrap Environment
        run: bubblewrap doctor

      - name: Generate Android Project
        run: bubblewrap update --skipVersionUpgrade

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-STORE-APK
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 7
