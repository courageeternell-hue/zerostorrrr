name: Build ZERO STORE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Restore Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > zero-store-release.keystore

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Generate Android Project
        run: |
          node -e "
          const fs = require('fs');
          const crypto = require('crypto');
          const { TwaManifest, TwaGenerator, ConsoleLog } = require('@bubblewrap/core');

          (async () => {
            const manifest = await TwaManifest.fromFile('twa-manifest.json');
            const errors = manifest.validate();
            if (errors) throw new Error(errors);

            const generator = new TwaGenerator();
            await generator.createTwaProject('.', manifest, new ConsoleLog('ZERO STORE'));

            const data = fs.readFileSync('twa-manifest.json');
            const checksum = crypto.createHash('sha1').update(data).digest('hex');
            fs.writeFileSync('manifest-checksum.txt', checksum);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          "

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-STORE-APK
          path: app-release-signed.apk
          if-no-files-found: error
